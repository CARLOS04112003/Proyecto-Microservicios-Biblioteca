openapi: 3.0.3
info:
  title: Reservation Service API
  version: 1.0.0
servers:
  - url: http://localhost:8084
paths:
  /api/reservations:
    post:
      summary: Crear una reserva
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201': { description: Reserva creada }
        '409': { description: Regla de negocio incumplida }
    get:
      summary: Listar todas las reservas (personal)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lista de reservas }
  /api/reservations/me:
    get:
      summary: Listar mis reservas
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lista de reservas del usuario }
  /api/reservations/{id}/cancel:
    post:
      summary: Cancelar una reserva
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Reserva cancelada }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateReservationRequest:
      type: object
      required: [bookId]
      properties:
        bookId: { type: string, format: uuid }
