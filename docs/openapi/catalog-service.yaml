openapi: 3.0.3
info:
  title: Biblioteca - Catálogo
  version: 1.0.0
servers:
  - url: http://localhost:8080
security: [{bearerAuth: []}]
paths:
  /api/books:
    get:
      summary: Buscar libros
      parameters:
        - {name: query, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 0}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200': {description: Página de libros}
    post:
      summary: Crear libro (ADMIN o LIBRARIAN)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookRequest'}
      responses:
        '201': {description: Libro creado, content: {application/json: {schema: {$ref: '#/components/schemas/Book'}}}}
  /api/books/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Obtener libro
      responses:
        '200': {description: Libro, content: {application/json: {schema: {$ref: '#/components/schemas/Book'}}}}
        '404': {description: No encontrado}
    put:
      summary: Actualizar libro (ADMIN o LIBRARIAN)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookRequest'}
      responses:
        '200': {description: Libro actualizado}
    delete:
      summary: Desactivar libro (ADMIN)
      responses:
        '204': {description: Desactivado}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    BookRequest:
      type: object
      required: [isbn, title, author, category, totalCopies]
      properties:
        isbn: {type: string, maxLength: 20}
        title: {type: string, maxLength: 180}
        author: {type: string, maxLength: 140}
        category: {type: string, maxLength: 100}
        description: {type: string, maxLength: 1000}
        totalCopies: {type: integer, minimum: 1, maximum: 1000}
    Book:
      allOf:
        - {$ref: '#/components/schemas/BookRequest'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            availableCopies: {type: integer}
            available: {type: boolean}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
