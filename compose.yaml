name: biblioteca-microservicios

services:

  mysql:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}

    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_0900_ai_ci"
      ]

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - biblioteca-net



  auth-service:

    build:
      context: .
      dockerfile: auth-service/Dockerfile

    restart: on-failure

    environment:

      SPRING_PROFILES_ACTIVE: mysql

      DB_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_password

      JWT_SECRET: ${JWT_SECRET:-mi_clave_jwt_segura_123456789}

      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123*}
      LIBRARIAN_PASSWORD: ${LIBRARIAN_PASSWORD:-Library123*}
      MEMBER_PASSWORD: ${MEMBER_PASSWORD:-Member123*}


    depends_on:

      mysql:
        condition: service_healthy


    ports:

      - "8081:8081"


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/actuator/health | grep UP"
        ]

      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s


    networks:

      - biblioteca-net




  catalog-service:

    build:
      context: .
      dockerfile: catalog-service/Dockerfile

    restart: on-failure

    environment:

      SPRING_PROFILES_ACTIVE: mysql

      DB_URL: jdbc:mysql://mysql:3306/catalog_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

      DB_USERNAME: catalog_user

      DB_PASSWORD: catalog_password

      JWT_SECRET: ${JWT_SECRET:-mi_clave_jwt_segura_123456789}

      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-biblioteca-internal-key-change-me}


    depends_on:

      mysql:
        condition: service_healthy


    ports:

      - "8092:8082"


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8082/actuator/health | grep UP"
        ]

      interval: 10s

      timeout: 5s

      retries: 30

      start_period: 120s


    networks:

      - biblioteca-net





  loan-service:


    build:

      context: .

      dockerfile: loan-service/Dockerfile


    restart: on-failure



    environment:


      SPRING_PROFILES_ACTIVE: mysql


      DB_URL: jdbc:mysql://mysql:3306/loan_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

      DB_USERNAME: loan_user

      DB_PASSWORD: loan_password



      JWT_SECRET: ${JWT_SECRET:-mi_clave_jwt_segura_123456789}


      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-biblioteca-internal-key-change-me}


      CATALOG_BASE_URL: http://catalog-service:8082





    depends_on:


      mysql:

        condition: service_healthy


      catalog-service:

        condition: service_healthy





    ports:


      - "8093:8083"




    healthcheck:


      test:

        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8083/actuator/health | grep UP"
        ]

      interval: 10s

      timeout: 5s

      retries: 30

      start_period: 120s




    networks:


      - biblioteca-net





  reservation-service:


    build:

      context: .

      dockerfile: reservation-service/Dockerfile



    restart: on-failure



    environment:


      SPRING_PROFILES_ACTIVE: mysql


      DB_URL: jdbc:mysql://mysql:3306/reservation_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

      DB_USERNAME: reservation_user

      DB_PASSWORD: reservation_password


      JWT_SECRET: ${JWT_SECRET:-mi_clave_jwt_segura_123456789}


      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-biblioteca-internal-key-change-me}


      CATALOG_BASE_URL: http://catalog-service:8082





    depends_on:


      mysql:

        condition: service_healthy


      catalog-service:

        condition: service_healthy





    ports:


      - "8094:8084"




    healthcheck:


      test:

        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8084/actuator/health | grep UP"
        ]

      interval: 10s

      timeout: 5s

      retries: 30

      start_period: 120s




    networks:


      - biblioteca-net






  review-service:


    build:

      context: .

      dockerfile: review-service/Dockerfile


    restart: on-failure



    environment:


      SPRING_PROFILES_ACTIVE: mysql


      DB_URL: jdbc:mysql://mysql:3306/review_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

      DB_USERNAME: review_user

      DB_PASSWORD: review_password


      JWT_SECRET: ${JWT_SECRET:-mi_clave_jwt_segura_123456789}


      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-biblioteca-internal-key-change-me}


      CATALOG_BASE_URL: http://catalog-service:8082





    depends_on:


      mysql:

        condition: service_healthy


      catalog-service:

        condition: service_healthy





    ports:


      - "8095:8085"




    healthcheck:


      test:

        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8085/actuator/health | grep UP"
        ]

      interval: 10s

      timeout: 5s

      retries: 30

      start_period: 120s




    networks:


      - biblioteca-net





  api-gateway:


    build:

      context: .

      dockerfile: api-gateway/Dockerfile


    restart: on-failure



    environment:


      AUTH_SERVICE_URL: http://auth-service:8081

      CATALOG_SERVICE_URL: http://catalog-service:8082

      LOAN_SERVICE_URL: http://loan-service:8083

      RESERVATION_SERVICE_URL: http://reservation-service:8084

      REVIEW_SERVICE_URL: http://review-service:8085





    depends_on:


      auth-service:

        condition: service_healthy


      catalog-service:

        condition: service_healthy


      loan-service:

        condition: service_healthy


      reservation-service:

        condition: service_healthy


      review-service:

        condition: service_healthy





    ports:


      - "8090:8080"




    healthcheck:


      test:

        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health | grep UP"
        ]


      interval: 10s

      timeout: 5s

      retries: 30

      start_period: 120s




    networks:


      - biblioteca-net





volumes:

  mysql_data:



networks:

  biblioteca-net:

    driver: bridge