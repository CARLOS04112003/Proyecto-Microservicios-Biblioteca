server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:authdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:YmlibGlvdGVjYS1kZW1vLWp3dC1zZWNyZXQta2V5LTIwMjYtY2hhbmdlLWluLXByb2R1Y3Rpb24=}
    issuer: biblioteca-auth
    expiration-minutes: 120

app:
  seed:
    enabled: true
    admin-password: ${ADMIN_PASSWORD:Admin123*}
    librarian-password: ${LIBRARIAN_PASSWORD:Library123*}
    member-password: ${MEMBER_PASSWORD:Member123*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs
