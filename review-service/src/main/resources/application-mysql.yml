spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/review_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:review_user}
    password: ${DB_PASSWORD:review_password}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
  h2:
    console:
      enabled: false
