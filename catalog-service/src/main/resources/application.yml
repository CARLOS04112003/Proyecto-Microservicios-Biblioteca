server:
  port: 8082

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:catalogdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:YmlibGlvdGVjYS1kZW1vLWp3dC1zZWNyZXQta2V5LTIwMjYtY2hhbmdlLWluLXByb2R1Y3Rpb24=}

app:
  internal-api-key: ${INTERNAL_API_KEY:biblioteca-internal-key-change-me}
  seed:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
